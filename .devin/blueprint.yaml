# Devin environment blueprint for this repository.
# Sync + build from the Devin UI after merging changes to this file.
initialize:
  - name: "Install uv (Python package manager)"
    run: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      echo 'export PATH="$HOME/.local/bin:$PATH"' >> $ENVRC

  - name: "System libraries for cairosvg (PDF/PNG rendering)"
    run: |
      sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2 || echo "apt unavailable; cairosvg wheels may still work"

maintenance:
  - name: "Sync Python dependencies"
    run: |
      export PATH="$HOME/.local/bin:$PATH"
      uv sync

knowledge:
  - name: test
    contents: |
      uv run pytest -q

  - name: run
    contents: |
      Full detailing package for a model:
      uv run recognition run samples/AC20-FZK-Haus.ifc out/fzk --project FZK
      Outputs: out/fzk/summary.json, report.md, schedules/, sheets/*.png|pdf|dxf, model.detailed.ifc

  - name: check
    contents: |
      Compliance gate (exit 1 on error-level findings):
      uv run recognition check samples/Duplex.ifc

  - name: regenerate-examples
    contents: |
      After any change under recognition/ or rules/:
      for m in AC20-FZK-Haus Duplex; do uv run recognition run samples/$m.ifc examples/$m --project $m; done

  - name: autopilot
    contents: |
      The product loop — brief in, verified candidates out, winner picked by the scorer:
      uv run recognition autopilot briefs/familienhaus.json              # local engine, ~20 s, no key
      uv run recognition autopilot briefs/<p>.json --engine devin --publish
      Artifacts per candidate: plan.json, design.py, model.ifc, verdict.json, mesh.json, pkg/sheets/.
      --publish copies them into web/data/ for the static Studio. Exit code is the gate.

  - name: interview
    contents: |
      One round of the intake interview (DEVIN_API_KEY required):
      uv run recognition interview transcript.json --out reply.json
      transcript.json: {"messages":[{"role":"client","text":"..."}], "session_id":"", "round":1}
      The reply carries message, brief, questions, assumptions, done — validated at the boundary.

  - name: skills
    contents: |
      Repo skills live in .agents/skills/ (open Agent Skills layout). Invoke with @skills:<name>:
      architect-plan (author an ArchitectPlan) · interview-brief (intake interview) ·
      verify-repair (run the gate, repair at the lowest layer) · studio-visual-test
      (frame-by-frame browser test before any web/ PR). AGENTS.md is the onboarding file.

  - name: studio
    contents: |
      The Studio is static (web/), served by GitHub Pages, no build step:
      python3 -m http.server 8123 -d web
      Never hand-edit web/data/ (generated by --publish). Before any web/ PR, run
      @skills:studio-visual-test and put current screenshots in docs/ui/.
