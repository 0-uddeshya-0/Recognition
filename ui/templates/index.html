<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recognition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' fill='none' stroke='%2315191D' stroke-width='2.5'/%3E%3Crect x='8' y='8' width='8' height='8' fill='%2315191D'/%3E%3C/svg%3E">
</head>
<body>
<header class="top" id="top">
  <a class="wordmark" href="/" title="Recognition — start over">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="8" y="8" width="8" height="8" fill="currentColor"/></svg>
    Recognition
  </a>
  <div id="top-title" class="title"></div>
  <div class="spacer"></div>
  <div id="top-delta" class="delta"></div>
  <div id="top-stamp"></div>
  <a class="ghost" href="/" id="top-new" hidden>New model</a>
</header>
<main id="app"></main>
<script>
window.RECOGNITION = {
  jobId: {{ job_id | tojson }},
  samples: {{ samples_json | tojson }},
  devin: {{ devin | tojson }},
  repo: {{ repo | tojson }},
  defaultRules: {{ default_rules | tojson }},
  version: {{ version | tojson }}
};
</script>
<script src="/static/app.js"></script>
</body>
</html>
