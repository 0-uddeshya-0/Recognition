<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recognition Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/studio.css">
</head>
<body class="studio-body">
<header class="top">
  <a class="wordmark" href="/studio" title="Recognition Studio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="8" y="8" width="8" height="8" fill="currentColor"/></svg>
    Recognition <span class="studio-tag">Studio</span>
  </a>
  <div class="title"><h1 id="project">House</h1></div>
  <div class="spacer"></div>
  <div id="status" class="status"></div>
</header>
<main class="studio">
  <section class="pane code-pane">
    <div class="pane-head"><span class="mono small">house.py</span><span class="muted mono small" id="code-meta"></span></div>
    <textarea id="code" class="mono code" spellcheck="false" placeholder="Loading house.py…"></textarea>
    <div class="chat" id="chat" hidden></div>
    <form class="chat-in" id="chat-form">
      <input type="text" id="chat-text" placeholder="Ask for a change… e.g. make the Schlafzimmer at least 25 m²" autocomplete="off" disabled>
      <button class="btn secondary" id="chat-send" type="submit" disabled>Send</button>
    </form>
    <div class="pane-foot">
      <button class="btn accent" id="build">Build</button>
      <span class="muted small">Ctrl+Enter builds</span>
      <div class="spacer"></div>
      <div id="verdict"></div>
    </div>
    <div id="problems" class="problems"></div>
  </section>
  <section class="pane view-pane">
    <div class="pane-head"><span class="lbl">3D</span><span class="muted small">drag to orbit · wheel to zoom · hover for tags</span></div>
    <div class="sheet v3 studio-3d" id="v3"><div class="v3-wait" id="v3-wait">Build to see the model</div></div>
  </section>
  <section class="pane view-pane">
    <div class="pane-head"><span class="lbl">2D</span><span class="mono small" id="sheetno"></span><span class="small" id="storey"></span><div class="spacer"></div>
      <span class="nav small" id="nav" hidden><button id="prev" aria-label="previous sheet">◀</button><button id="next" aria-label="next sheet">▶</button></span><a id="pdf" class="small" href="#" target="_blank" rel="noopener" hidden>PDF ↗</a></div>
    <div class="studio-2d" id="v2"><div class="v3-wait">Build to see the sheet</div></div>
  </section>
</main>
<script>window.STUDIO = { jobId: {{ job_id | tojson }} };</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module" src="/static/viewer3d.js"></script>
<script src="/static/studio.js"></script>
</body>
</html>
