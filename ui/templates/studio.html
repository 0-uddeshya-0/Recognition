<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recognition Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/studio.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' fill='none' stroke='%2315191D' stroke-width='2.5'/%3E%3Crect x='8' y='8' width='8' height='8' fill='%2315191D'/%3E%3C/svg%3E">
</head>
<body class="studio-body">
<header class="top">
  <a class="wordmark" href="/studio" title="Recognition Studio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="8" y="8" width="8" height="8" fill="currentColor"/></svg>
    Recognition <span class="studio-tag">Studio</span>
  </a>
  <div class="title"><input type="text" id="project" class="project" value="Haus am Hang" aria-label="Project name"></div>
  <div class="spacer"></div>
  <div id="status" class="status"></div>
  <a class="ghost" id="full" href="/" hidden>Full view ↗</a>
</header>
<main class="studio">
  <section class="pane code-pane">
    <div class="pane-head">
      <div class="ftabs"><button data-f="code" class="on">house.py</button><button data-f="rules">rules.yaml</button></div>
      <span class="muted mono small" id="code-meta"></span>
    </div>
    <textarea id="code" class="mono code" spellcheck="false" placeholder="Loading house.py…"></textarea>
    <textarea id="rules" class="mono code" spellcheck="false" hidden>{{ default_rules }}</textarea>
    <div class="pane-foot">
      <button class="btn accent" id="build">Build</button>
      <span class="muted small" id="hint">Ctrl+Enter builds</span>
      <div class="spacer"></div>
      <div id="verdict"></div>
    </div>
    <div id="problems" class="problems"></div>
  </section>
  <section class="pane view-pane">
    <div class="pane-head"><span class="lbl">3D</span><span class="muted small" id="v3-info"></span><div class="spacer"></div><label class="v3-opts"><input type="checkbox" id="rooms" checked> Rooms</label></div>
    <div class="sheet v3 studio-3d" id="v3"><div class="v3-wait" id="v3-wait">Build to see the model</div></div>
  </section>
  <section class="pane view-pane">
    <div class="pane-head"><span class="lbl">2D</span><span class="mono small" id="sheetno"></span><span class="small" id="storey"></span><div class="spacer"></div>
      <span class="nav small"><button id="prev" aria-label="previous sheet">◀</button><button id="next" aria-label="next sheet">▶</button></span><a id="pdf" class="small" href="#" target="_blank" rel="noopener" hidden>PDF ↗</a></div>
    <div class="studio-2d" id="v2"><div class="v3-wait">Build to see the sheet</div></div>
  </section>
</main>
<script>window.STUDIO = { jobId: {{ job_id | tojson }}, defaultRules: {{ default_rules | tojson }} };</script>
<script type="importmap">{"imports":{"three":"/static/vendor/three.module.js"}}</script>
<script type="module" src="/static/viewer3d.js"></script>
<script src="/static/studio.js"></script>
</body>
</html>
