[project]
name = "recognition"
version = "0.1.0"
description = "Architecture-as-code harness: turns an IFC model into schedules, compliance reports and 2D drawings so Devin can govern detailing like software."
requires-python = ">=3.12"
dependencies = [
    "ifcopenshell>=0.8.5",
    "shapely>=2.1",
    "svgwrite>=1.4",
    "cairosvg>=2.7",
    "ezdxf>=1.3",
    "pyyaml>=6.0",
]

[project.scripts]
recognition = "recognition.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recognition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
